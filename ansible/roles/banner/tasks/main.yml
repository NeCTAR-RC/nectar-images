---
- name: Include OS-specific variables
  include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] }}.yml"
    - "default.yml"

- name: Set banner file (non-Ubuntu)
  template:
    src: banner.j2
    dest: /etc/motd
    force: yes
  when:
    - ansible_facts['distribution'] != 'Ubuntu'
    - ansible_facts['os_family'] != 'Windows'

- name: Set banner file (Windows)
  ansible.windows.win_template:
    src: banner.j2
    dest: C:\ProgramData\Nectar\motd.txt
  when: ansible_facts['os_family'] == 'Windows'

- name: Show banner on interactive SSH logins (Windows)
  ansible.windows.win_copy:
    src: profile.ps1
    dest: C:\Windows\System32\WindowsPowerShell\v1.0\profile.ps1
  when: ansible_facts['os_family'] == 'Windows'

- name: Set banner file (Ubuntu)
  template:
    src: banner-Ubuntu.j2
    dest: /etc/update-motd.d/00-header
    force: yes
  when: ansible_facts['distribution'] == 'Ubuntu'
