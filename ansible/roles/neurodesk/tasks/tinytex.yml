---
# Targeted TinyTeX toolchain for notebook PDF export without pulling in the
# larger Debian TeX Live package set (translated from the upstream Dockerfile)
- name: Install TinyTeX and TeX packages for notebook PDF export
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 300 \
          https://raw.githubusercontent.com/rstudio/tinytex/master/tools/install-bin-unix.sh \
          -o /tmp/install-bin-unix.sh && bash /tmp/install-bin-unix.sh
      mv "$HOME/.TinyTeX" /opt/TinyTeX
      tlmgr_path="$(echo /opt/TinyTeX/bin/*/tlmgr)"
      "$tlmgr_path" option sys_bin /usr/local/bin
      "$tlmgr_path" path add
      "$tlmgr_path" update --self
      "$tlmgr_path" install \
          tcolorbox parskip caption float geometry amsmath amsfonts latex \
          upquote eurosym fontspec unicode-math fancyvrb grffile adjustbox \
          hyperref titling tools booktabs enumitem ulem soul jknapltx rsfs \
          graphics iftex xcolor pdfcol
    creates: /opt/TinyTeX
    executable: /bin/bash
  environment:
    HOME: /root
