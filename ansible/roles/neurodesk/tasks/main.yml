---
- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['distribution'] | lower }}.yml"
    - "{{ ansible_facts['os_family'] | lower }}.yml"
    - "default.yml"

- name: Install extra packages
  ansible.builtin.package:
    name: "{{ neurodesk_extra_packages }}"
    state: present

- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  with_items:
    - /data
    - /opt/neurodesktop
    - /etc/jupyter
    - /etc/skel/.config/lxpanel
    - /etc/skel/.config/lxpanel/LXDE
    - /etc/skel/.config/lxpanel/LXDE/panels
    - /etc/skel/.config/Code/User

# Files under upstream/ are vendored verbatim from the Neurodesktop repo
# (see files/upstream/MANIFEST); files under config/ are our local copies.
- name: Copy config files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  with_items:
    - src: config/lxde/background.png
      dest: /usr/share/lxde/wallpapers/desktop_wallpaper.png
    - src: upstream/config/lxde/pcmanfm.conf
      dest: /etc/xdg/pcmanfm/LXDE/pcmanfm.conf
    - src: config/lxde/lxterminal.conf
      dest: /usr/share/lxterminal/lxterminal.conf
    - src: config/lxde/panel
      dest: /etc/skel/.config/lxpanel/LXDE/panels/panel
    - src: upstream/config/lxde/libfm.conf
      dest: /etc/skel/.config/libfm
    - src: upstream/config/lxde/rc.xml
      dest: /etc/xdg/openbox/LXDE/rc.xml
    # upstream's config/lxde/.bashrc breaks lots of things, so deliberately
    # not installed
    - src: config/neurodesktop.sh
      dest: /etc/profile.d/neurodesktop.sh
    # mineapps
    - src: upstream/config/lxde/mimeapps.list
      dest: /etc/skel/.config/mimeapps.list
    # misc
    - src: upstream/config/conda/conda-readme.md
      dest: /etc/skel/conda-readme.md
    # Unify X11 CLIPBOARD/PRIMARY selections in xrdp sessions (needs autocutsel)
    - src: upstream/config/lxde/75neurodesk-clipboard-sync
      dest: /etc/X11/Xsession.d/75neurodesk-clipboard-sync
    - src: upstream/config/itksnap
      dest: /etc/skel/.config/.itksnap.org
    # VSCode
    - src: upstream/config/vscode/settings.json
      dest: /etc/skel/.config/Code/User/settings.json

- name: Copy module system
  ansible.builtin.copy:
    src: upstream/config/lmod/module.sh
    dest: /usr/share/
    mode: "0755"

- name: Configure persistent bash history
  ansible.builtin.blockinfile:
    path: /etc/bash.bashrc
    marker: "# {mark} NEURODESK PERSISTENT BASH HISTORY"
    block: |
      if [[ $- == *i* ]]; then
          shopt -s histappend

          if [ -d "${HOME}/neurodesktop-storage" ] && [ -w "${HOME}/neurodesktop-storage" ]; then
              export HISTFILE="${HOME}/neurodesktop-storage/.bash_history"
          else
              export HISTFILE="${HISTFILE:-$HOME/.bash_history}"
          fi

          export HISTSIZE=100000
          export HISTFILESIZE=200000
          export HISTCONTROL=ignoredups:erasedups

          # Persist history continuously so abrupt session closes do not lose commands
          if [[ "${PROMPT_COMMAND:-}" != *"history -a"* ]]; then
              if [ -n "${PROMPT_COMMAND:-}" ]; then
                  export PROMPT_COMMAND="history -a; history -n; ${PROMPT_COMMAND}"
              else
                  export PROMPT_COMMAND="history -a; history -n"
              fi
          fi
      fi

- name: Create strace directory
  ansible.builtin.file:
    path: /opt/strace
    state: directory
    mode: "0755"

- name: Install static strace for debugging inside containers
  ansible.builtin.unarchive:
    src: https://github.com/JuliaBinaryWrappers/strace_jll.jl/releases/download/strace-v6.7.0%2B1/strace.v6.7.0.x86_64-linux-gnu.tar.gz
    dest: /opt/strace
    remote_src: true
    extra_opts:
      - --strip-components=1
    creates: /opt/strace/strace

- name: Create storage directory
  ansible.builtin.file:
    path: /neurodesktop-storage
    state: directory
    mode: "0777"

- name: Create storage directory
  ansible.builtin.file:
    path: /etc/skel/Desktop
    state: directory
    mode: "0755"

- name: Create a symbolic link to upload directory (has to be forced because home does not yet exist at buildtime)
  ansible.builtin.file:
    src: /neurodesktop-storage
    dest: /etc/skel/Desktop/neurodesktop-storage
    state: link

- name: Create a symbolic link
  ansible.builtin.file:
    src: /home/vdiuser/thinclient_drives/GUACFS
    dest: /etc/skel/Desktop/transfer
    state: link
    force: true
    follow: false

# TODO(andybotting): Not needed outside a container?
# Allow the root user to access the sshfs mount
# https://github.com/neurodesk/neurodesk/issues/47
- name: Ensure SELinux is set to enforcing mode
  ansible.builtin.lineinfile:
    path: /etc/fuse.conf
    regexp: "#user_allow_other"
    line: "user_allow_other"

- name: Include CVMFS
  ansible.builtin.include_tasks: cvmfs.yml

- name: Include Apptainer
  ansible.builtin.include_tasks: apptainer.yml

- name: Include Conda
  ansible.builtin.include_tasks: conda.yml

- name: Include Jupyter
  ansible.builtin.include_tasks: jupyter.yml

- name: Include Nextflow
  ansible.builtin.include_tasks: nextflow.yml

- name: Include TinyTeX
  ansible.builtin.include_tasks: tinytex.yml

- name: Include NeuroCommand
  ansible.builtin.include_tasks: neurocommand.yml
