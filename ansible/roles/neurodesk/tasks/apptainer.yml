---
- name: Install required packages for Ubuntu
  ansible.builtin.apt:
    name: software-properties-common
    state: present

- name: Add Apptainer PPA
  ansible.builtin.deb822_repository:
    name: apptainer-ppa
    types: [deb]
    uris: https://ppa.launchpadcontent.net/apptainer/ppa/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: [main]
    signed_by: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xF6B0F5193D4F3301EF491FF0AFE36534FC6218AE
    enabled: true

- name: Install Apptainer
  ansible.builtin.apt:
    name:
      - apptainer
      - apptainer-suid
      # Rootless/unprivileged container support (upstream ships these)
      - fuse-overlayfs
      - squashfuse
    state: present
    update_cache: true
