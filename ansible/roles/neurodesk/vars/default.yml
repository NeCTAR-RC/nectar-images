---
# Singularity bind mount list
neurodesk_mountpoint_list_url: https://raw.githubusercontent.com/NeuroDesk/neurocontainers/master/recipes/globalMountPointList.txt

# Packages translated from the upstream Dockerfile apt sections ("base image
# dependencies" and "Install Tools and Libs"), at the revision pinned in
# UPSTREAM_REF. Container-only packages (Guacamole/Tomcat/VNC runtime and
# build deps, the in-image Slurm stack) are excluded. Unlike upstream we keep
# general compilers, which upstream purges from the container to save space.
neurodesk_extra_packages:
  # Base image dependencies
  - acl
  - apt-transport-https
  - autocutsel
  - curl
  - dbus-x11
  - dirmngr
  - gpg
  - gpg-agent
  - gvfs
  - openjdk-21-jre-headless
  - software-properties-common
  - wget
  - xz-utils
  # Tools and libs
  - aria2
  - bc
  - davfs2
  - dnsutils
  - gedit
  - gh
  - git
  - git-annex
  - gnome-keyring
  - graphviz
  - htop
  - imagemagick
  - iputils-ping
  - less
  - libgfortran5
  - libpci3
  - lmod
  - lua-bit32
  - lua-filesystem
  - lua-json
  - lua-lpeg
  - lua-posix
  - lua-term
  - lua5.2
  - lxtask
  - man-db
  - nano
  - nextcloud-desktop
  - nodejs
  - openssh-client
  - openssh-server
  - owncloud-client
  - pciutils
  - python3-setuptools
  - qdirstat
  - rclone
  - rsync
  - s3fs
  - screen
  - sshfs
  - tcllib
  - tcsh
  - tk
  - tmux
  - tree
  - uidmap
  - unzip
  - vim
  - xdg-utils
  - zip
  # Kept for desktop users compiling their own code
  - build-essential
  - gcc
  - pkg-config
  # Kept for the CVMFS dependency chain (upstream apt-marks these manual)
  - uuid-dev
  # Kept from earlier syncs
  - cryptsetup-bin
  - lsb-release
  - squashfs-tools
