---
# Python packages translated from the upstream Dockerfile pip section, at the
# revision pinned in UPSTREAM_REF. Deliberately skipped from upstream:
# the AI-agent, collaboration, ASTRA, in-container Slurm and sshd-over-Jupyter
# stacks, which are not used on the Nectar VDS.
neurodesk_python_packages:
  - datalad
  - nipype
  - niwrap
  - nbdev
  - nf-core
  - pydra==1.0a11
  - nipoppy
  - matplotlib
  - datalad-container
  - datalad-osf
  - osfclient
  - watermark
  - ipyniivue==2.4.4
  - jupyter-server-proxy==4.5.0
  - jupyterlmod
  - jupyterlab-git
  - jupyterlab_rise
  - jupyterlab-niivue==0.2.7
  - jupyterlab_myst==2.7.0
  - papermill
  - ipycanvas
  - jupyter-resource-usage
  - jupyter_scheduler
  - httpx
  - anywidget==0.11.0
  - ipykernel==6.31.0
  - ipywidgets==8.1.9
  - ipyvolume
  - jupyterlab_widgets==3.0.17
  - nbgitpuller
  - xnat
  - pytest
  - bash_kernel
  - uv==0.12.17
  - requests>=2.34.2
  - chardet<8
  # Not needed in the upstream image (provided by its jupyter/base-notebook
  # base image); we install the JupyterLab server stack ourselves
  - jupyterlab
  - jupyter-server
  - nbclassic
  - notebook

# Installed as an isolated uv tool: snakemake needs packaging<26, which
# conflicts with conda
neurodesk_snakemake_version: 9.27.0

neurodesk_conda_packages:
  - nb_conda_kernels

# https://www.nf-test.com
neurodesk_nftest_version: 0.9.5
