---
# Python packages translated from the upstream Dockerfile pip section, at the
# revision pinned in UPSTREAM_REF. Deliberately skipped from upstream:
# notebook_intelligence, jupyterlab-slurm, jupyter-sshd-proxy and litellm
# (AI-agent, in-container Slurm and sshd-over-Jupyter stacks not used on the
# Nectar VDS).
neurodesk_python_packages:
  - datalad
  - nipype
  - niwrap
  - nbdev
  - nf-core
  - snakemake
  - pydra==1.0a9
  - nipoppy
  - matplotlib
  - datalad-container
  - datalad-osf
  - osfclient
  - watermark
  - ipyniivue
  - jupyter-server-proxy
  - jupyterlmod
  - jupyterlab-git
  - jupyterlab_rise
  - jupyterlab-niivue==0.2.7
  - jupyterlab_myst
  - papermill
  - ipycanvas
  - jupyter-resource-usage
  - jupyter_scheduler
  - httpx
  - ipywidgets==8.1.8
  - ipyvolume
  - jupyterlab_widgets
  - nbgitpuller
  - xnat
  - pytest
  - bash_kernel
  - packaging>=26.0
  - requests>=2.34.2
  - chardet<8
  # Not needed in the upstream image (provided by its jupyter/base-notebook
  # base image); we install the JupyterLab server stack ourselves
  - jupyterlab
  - jupyter-server
  - nbclassic
  - notebook

neurodesk_conda_packages:
  - nb_conda_kernels

# https://www.nf-test.com
neurodesk_nftest_version: 0.9.5
