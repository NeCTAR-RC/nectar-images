---
- name: Install dependencies for Guacamole
  apt:
    name: '{{ guacamole_packages }}'
    state: 'latest'
    update_cache: true

- name: Download Guacamole server
  get_url:
    url: "https://archive.apache.org/dist/guacamole/{{ guacamole_version }}/source/guacamole-server-{{ guacamole_version }}.tar.gz"
    dest: "/tmp/guacamole-server-{{ guacamole_version }}.tar.gz"

- name: Extract Guacamole server
  unarchive:
    src: "/tmp/guacamole-server-{{ guacamole_version }}.tar.gz"
    copy: no
    dest: /tmp

- name: Build Guacamole server
  shell: "{{ item }}"
  args:
    chdir: "/tmp/guacamole-server-{{ guacamole_version }}"
    creates: "{{ guacamole_install_prefix }}/sbin/guacd"
  with_items:
    # guacamole-server builds with -Werror, and newer FreeRDP 3 headers mark
    # APIs it still uses as deprecated, so keep those as warnings only
    - "./configure --prefix={{ guacamole_install_prefix }} --with-systemd-dir=/etc/systemd/system CFLAGS='-g -O2 -Wno-error=deprecated-declarations'"
    - "make -j {{ ansible_facts['processor_vcpus'] }}"
    - make install
    - ldconfig

- name: Exclude FreeRDP packages from unattended upgrades
  copy:
    content: |
      // guacd is built from source against the FreeRDP/WinPR libraries present
      // at image build time, and breaks when they are upgraded underneath it.
      // FreeRDP is upgraded via new image builds instead.
      Unattended-Upgrade::Package-Blacklist {
          "freerdp";
          "libfreerdp";
          "libwinpr";
      };
    dest: /etc/apt/apt.conf.d/51unattended-upgrades-freerdp
    mode: '0644'

- name: Create guacd group
  group:
    name: guacd

- name: Create guacd user
  user:
    name: guacd
    comment: Guacamole proxy daemon
    group: guacd
    system: yes
    createhome: yes
    home: /var/lib/guacd
    shell: /sbin/nologin

- name: Create guacd systemd unit
  template:
    src: guacd.service.j2
    dest: /etc/systemd/system/guacd.service

- name: Start guacd
  service:
    name: guacd
    enabled: yes

- name: Clean up Guacample server temp file
  file:
    path: "{{ item }}"
    state: absent
  with_items:
    - "/tmp/guacamole-server-{{ guacamole_version }}.tar.gz"
    - "/tmp/guacamole-server-{{ guacamole_version }}"
