---
- name: Install VS Code repo (apt)
  ansible.builtin.deb822_repository:
    name: vscode
    types: [deb]
    uris: "{{ vscode_mirror }}/repos/code"
    suites: [stable]
    components: [main]
    architectures: [amd64]
    signed_by: "{{ vscode_mirror }}/keys/microsoft.asc"
    enabled: true

- name: install dependencies (apt)
  ansible.builtin.apt:
    name: "{{ vscode_deps }}"
    state: present

- name: Install VS Code (apt)
  ansible.builtin.apt:
    name: "{{ vscode_package }}"
    state: present
    update_cache: yes
