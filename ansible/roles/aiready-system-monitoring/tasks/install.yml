- name: Add Grafana APT repository
  deb822_repository:
    name: grafana
    types: [deb]
    uris: https://packages.grafana.com/oss/deb
    suites: [stable]
    components: [main]
    signed_by: https://apt.grafana.com/gpg.key
    enabled: true

- name: Install required packages
  apt:
    name:
      - prometheus
      - prometheus-node-exporter
      - grafana
    state: present
    update_cache: yes
