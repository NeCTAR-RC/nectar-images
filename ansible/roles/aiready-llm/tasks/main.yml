- name: Install PyTorch
  ansible.builtin.pip:
    name: "torch=={{ pytorch_version }}"
    executable: "{{ anaconda_link_dir }}/bin/pip"
    extra_args: "--no-cache-dir --index-url https://download.pytorch.org/whl/cu{{ cuda_version | replace('.', '') }}"
  become: true

- name: Pin PyTorch for the remaining installs
  copy:
    dest: /tmp/aiready-llm-constraints.txt
    content: "torch=={{ pytorch_version }}\n"
    mode: '0644'
  become: true

- name: Install llm packages using pip
  ansible.builtin.pip:
    name: "{{ item }}"
    executable: "{{ anaconda_link_dir }}/bin/pip"
    extra_args: --no-cache-dir
  environment:
    PIP_CONSTRAINT: /tmp/aiready-llm-constraints.txt
  loop: "{{ llm_packages }}"
  become: true

- name: Remove PyTorch pin
  file:
    path: /tmp/aiready-llm-constraints.txt
    state: absent
  become: true

- name: Copy example notebooks to JupyterLab directory
  become: yes
  copy:
    src: "{{ item }}"
    dest: "{{ examples_directory }}"
    mode: '0644'
  with_fileglob:
    - "notebooks/*.ipynb"
