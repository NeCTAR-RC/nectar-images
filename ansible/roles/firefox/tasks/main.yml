---
- name: Ensure Firefox is installed on non-Ubuntu distros
  package:
    name: firefox
    state: present
  when: ansible_facts['distribution'] != 'Ubuntu'

# Install Firefox on Ubuntu, while removing the 'snap' package
- block:
    - name: Remove Firefox Snap
      ansible.builtin.snap:
        state: absent
        name: firefox
      register: firefox_snap_removal
      changed_when: firefox_snap_removal.changed

    - name: Remove Firefox Snap deb
      ansible.builtin.apt:
        name: firefox
        state: absent
      when: firefox_snap_removal.changed

    - name: Create apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'

    # Key fingerprint 35BAA0B33E9EB396F59CA838C0BA5CE6DC6315A3; the checksum
    # fails the build loudly if the published key file ever changes
    - name: Add Mozilla apt repository signing key
      ansible.builtin.get_url:
        url: https://packages.mozilla.org/apt/repo-signing-key.gpg
        dest: /etc/apt/keyrings/packages.mozilla.org.asc
        checksum: sha256:3ecc63922b7795eb23fdc449ff9396f9114cb3cf186d6f5b53ad4cc3ebfbb11f
        owner: root
        group: root
        mode: '0644'

    - name: Add Mozilla apt repository for non-snap Firefox
      apt_repository:
        repo: 'deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main'
        filename: mozilla

    - name: Create apt preferences to pin the non-snap Firefox
      copy:
        dest: /etc/apt/preferences.d/mozilla
        content: |
          Package: *
          Pin: origin packages.mozilla.org
          Pin-Priority: 1000

          Package: firefox
          Pin: version 1:1snap1*
          Pin-Priority: -1

    - name: Set owner, group and permissions on pref file
      file:
        path: /etc/apt/preferences.d/mozilla
        owner: root
        group: root
        mode: 0444

    - name: Install Firefox
      ansible.builtin.apt:
        name: firefox
        state: latest
        update_cache: yes
        allow_downgrade: yes

  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Set Firefox system-wide preferences
  ansible.builtin.lineinfile:
    path: /etc/firefox/syspref.js
    regexp: '^pref\("{{ item.key }}",.*'
    line: 'pref("{{ item.key }}", {{ item.value }});'
    create: yes
    mode: '0644'
  with_dict: "{{ firefox_prefs }}"
  when:
    - firefox_prefs is defined
    - firefox_prefs | length > 0
