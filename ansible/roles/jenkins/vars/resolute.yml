---
#openstack_version:

puppet_repo:
  name: openvox8
  uris: https://apt.voxpupuli.org
  suites: ubuntu26.04
  components: openvox8
  signed_by: https://apt.voxpupuli.org/openvox-keyring.gpg

packages:
  - libpng-dev
  - python3-cinderclient
  - python3-designateclient
  - python3-glanceclient
  - python3-heatclient
  - python3-keystoneclient
  - python3-manilaclient
  - python3-mistralclient
  - python3-muranoclient
  - python3-neutronclient
  - python3-novaclient
  - python3-openstackclient
  - python3-saharaclient
  - python3-swiftclient
  - python3-troveclient
  - python3-build
  - sphinx-common
  - twine
  - dh-python
  - qemu-system-x86
  - pre-commit
  - nodejs

selenium: False

# puppetlabs_spec_helper drags in the real puppet gem (via puppetlabs-syntax),
# whose executables collide with openvox's. Install openvox last with force so
# its binstubs win instead of gem hanging on an overwrite prompt.
gem_packages:
  - { name: puppetlabs_spec_helper }
  - { name: openvox, force: true }

nodejs_repo: node_24.x
