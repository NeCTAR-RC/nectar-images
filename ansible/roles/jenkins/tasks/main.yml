---
- name: Include OS-specific variables
  include_vars: "{{ item }}"
  with_items:
    - "{{ ansible_facts['distribution_release'] }}.yml"
    - "common.yml"

- name: Disable unattended upgrades
  copy:
    content: 'APT::Periodic::Unattended-Upgrade "0";'
    dest: "{{ item }}"
  with_items:
    - /etc/apt/apt.conf.d/10periodic
    - /etc/apt/apt.conf.d/20auto-upgrades

- name: Add Nectar repositories
  deb822_repository:
    name: nectar
    uris: http://download.rc.nectar.org.au/nectar-ubuntu
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
      - "{{ ansible_facts['distribution_release'] }}-{{ openstack_version }}"
      - "{{ ansible_facts['distribution_release'] }}-{{ openstack_version }}-testing"
    components: main
    signed_by: http://download.rc.nectar.org.au/nectar-archive-key-2016.gpg
  when: openstack_version is defined

- name: Add Puppet repository
  deb822_repository:
    name: "{{ puppet_repo.name }}"
    uris: "{{ puppet_repo.uris }}"
    suites: "{{ puppet_repo.suites }}"
    components: "{{ puppet_repo.components }}"
    signed_by: "{{ puppet_repo.signed_by }}"
  when: puppet_repo is defined

- name: Add NodeJS repository
  deb822_repository:
    name: nodejs
    uris: "https://deb.nodesource.com/{{ nodejs_repo }}"
    suites: nodistro
    components: main
    signed_by: https://deb.nodesource.com/gpgkey/nodesource.gpg.key
  when: nodejs_repo is defined

- name: Perform an apt-update
  apt:
    update_cache: yes

- name: Install common packages
  apt:
    name: "{{ common_packages }}"
    state: present

- name: Install distribution specific packages
  apt:
    name: "{{ packages }}"
    state: present
  when: packages is defined

- name: Install distribution specific backport packages
  apt:
    name: "{{ backport_packages }}"
    state: latest
    default_release: "{{ ansible_facts['distribution_release'] }}-backports"
  when: backport_packages is defined

- name: Install pip packages
  pip:
    name: "{{ item.name }}"
    version: "{{ item.version }}"
  with_items: "{{ pip_packages }}"
  when: pip_packages is defined

- name: Run hivemind Install Tasks
  include_tasks: hivemind.yml

- name: Run selenium Install Tasks
  include_tasks: selenium.yml
  when: selenium | default(False)

- name: Install gem packages
  gem:
    name: "{{ item.name }}"
    version: "{{ item.version | default(omit) }}"
    force: "{{ item.force | default(omit) }}"
    state: present
    user_install: no
  with_items: "{{ gem_packages }}"
  when: gem_packages is defined

- name: Perform a full upgrade
  apt:
    upgrade: dist
    dpkg_options: 'force-confold,force-confdef'
  when: nectar_test_build is not defined

- name: Install packer
  include_tasks: packer.yml

- name: Install ansible
  include_tasks: ansible.yml
