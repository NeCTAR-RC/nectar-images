---
# Default variables for the deep learning role
python_version: "3.11"
pytorch_version: "2.14.1"
torchvision_version: "0.29.1"
torchaudio_version: "2.14.1"

cuda_enabled: true  # Set to true if CUDA is required
cuda_version: "13.0" # Match nvidia_cuda_versions in the nvidia-vgpu role

cv_packages:
  # Machine Learning Frameworks
  - scikit-learn
  # Computer Vision
  - scikit-image
  - opencv-python
  - pillow
  - timm
  - albumentations
  # Data handling and preprocessing
  - imageio
  - numpy<2
  - h5py
  - scipy
  - pandas
  - ydata-profiling
  # Visualization and plotting
  - matplotlib
  - seaborn
  - plotly
  - bokeh
  # Additional tools
  - wandb
  - tqdm
  - requests
  - widgetsnbextension
  - ipywidgets
