---
# Install the python support needed by the apt and deb822_repository modules
# while the image's original sources still exist, before we wipe them below.
# Long lock timeout in case the VM is running unattended updates.
- name: Install python apt and deb822 support
  apt:
    name:
      - python3-apt
      - python3-debian
    state: present
    update_cache: yes
    lock_timeout: 600

- name: Wipe existing sources.list
  copy:
    content: '# Sources are located in /etc/apt/sources.list.d'
    dest: /etc/apt/sources.list
    force: true

- name: Wipe existing sources.list.d files
  command: >-
    find /etc/apt/sources.list.d -type f -delete

- name: Create apt keyrings directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  with_items:
    - /etc/apt/keyrings
    - /usr/share/keyrings

- name: Set up apt repos
  deb822_repository:
    name: "{{ ansible_facts['distribution']|lower }}"
    types: "{{ apt_repo_types }}"
    uris: "{{ apt_repo_uris }}"
    suites: "{{ apt_repo_suites }}"
    components: "{{ apt_repo_components }}"
    enabled: true

# Update cache in a separate step so we can set a long lock timeout
# in case the VM is running unattended updates
- name: Perform an apt update
  apt:
    lock_timeout: 600
    update_cache: yes

- name: Perform a full upgrade
  apt:
    upgrade: dist
    dpkg_options: 'force-confold,force-confdef'
  when: nectar_test_build is not defined
