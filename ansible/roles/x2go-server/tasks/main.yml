- name: Install required packages for Ubuntu
  apt:
    name: software-properties-common
    state: present

- name: Add x2go repository
  deb822_repository:
    name: x2go-stable-ppa
    types: [deb]
    uris: https://ppa.launchpadcontent.net/x2go/stable/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: [main]
    signed_by: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xDE8A37E3797E53D6625FF9E1EA40B3B3C0B1202D
    enabled: true

- name: Install x2go packages
  apt:
    name: "{{ x2go_apt_packages }}"
    state: present
    update_cache: true
