---
- hosts: all
  become: yes
  gather_facts: yes

  vars_files:
    - vars/main.yml
    - vars/bumblebee-desktop.yml
    - vars/bumblebee-neurodesktop.yml

  roles:
    - image-name
    - default-user
    - repos
    - lxde-desktop
    - cvmfs
    - neurodesk
    - vscode
    - bumblebee-common
    - testing
    - nectar-user
    - facts
    - cleanup
